ame: Обходы — Подписанный APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Obhody_Android_v*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Select newest versioned project archive
        shell: bash
        run: |
          set -euo pipefail
          latest=$(find . -maxdepth 1 -type f -name 'Obhody_Android_v*.zip' -printf '%f\n' | sort -V | tail -n 1)
          test -n "$latest" || { echo 'No Obhody_Android_v*.zip file in repository root'; exit 1; }
          mkdir -p source
          unzip -q "$latest" -d source
          test -f source/obhody-app/android/settings.gradle.kts || { echo 'Archive must contain obhody-app/android/settings.gradle.kts'; exit 1; }
          echo "Building from $latest"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME" || { echo 'Android SDK not available on runner'; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify signing secrets and restore permanent key
        shell: bash
        env:
          OBHODY_KEYSTORE_BASE64: ${{ secrets.OBHODY_KEYSTORE_BASE64 }}
          OBHODY_KEYSTORE_PASSWORD: ${{ secrets.OBHODY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OBHODY_KEYSTORE_BASE64" || { echo 'Missing repository secret OBHODY_KEYSTORE_BASE64'; exit 1; }
          test -n "$OBHODY_KEYSTORE_PASSWORD" || { echo 'Missing repository secret OBHODY_KEYSTORE_PASSWORD'; exit 1; }
          printf '%s' "$OBHODY_KEYSTORE_BASE64" | base64 --decode > source/obhody-app/android/app/obhody-release.p12
          test -s source/obhody-app/android/app/obhody-release.p12

      - name: Build permanently signed release APK
        shell: bash
        env:
          OBHODY_KEYSTORE_PASSWORD: ${{ secrets.OBHODY_KEYSTORE_PASSWORD }}
        run: gradle -p source/obhody-app/android --no-daemon assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Obhody-SIGNED-release-APK
          path: source/obhody-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
