<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Обходы — администратор</title><style>
body{font-family:system-ui,Arial;background:#f3f6fb;color:#192635;margin:0}main{max-width:990px;margin:25px auto;padding:0 15px}h1{font-size:26px}section{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 15px #e0e6ed}input,textarea,select{box-sizing:border-box;padding:10px;border:1px solid #bfcbd8;border-radius:8px;font:inherit;max-width:100%;width:100%;margin:4px 0 10px}button{font:inherit;background:#1769aa;color:white;border:0;border-radius:8px;padding:10px 15px;margin:5px 6px 5px 0;cursor:pointer}button.secondary{background:#617080}button.danger{background:#b53a3a}.card{border:1px solid #dfe5ed;padding:12px;margin:9px 0;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;max-height:260px;overflow:auto}small{color:#64748b}
</style></head><body><main><h1>Обходы — конструктор</h1><section><label>API-ключ администратора<input id="token" type="password" placeholder="Укажите API_TOKEN из .env"></label><button onclick="load()">Подключиться</button><small>Ключ используется только текущей вкладкой и не сохраняется браузером.</small><div id="status"></div></section>
<section><h2>Создать маршрут</h2><label>Название маршрута<input id="routeName" placeholder="Обход складских помещений"></label><label>Описание<textarea id="description" rows="2"></textarea></label><div id="checkpoints"></div><button class="secondary" onclick="addCheckpoint()">+ Контрольная точка</button><button onclick="saveRoute()">Сохранить маршрут</button></section>
<section><h2>Маршруты</h2><div id="routes">Введите ключ и нажмите «Подключиться».</div></section><section><h2>Результаты обходов</h2><button onclick="loadResults()">Обновить результаты</button><div id="results"></div></section></main>
<script>
const $=id=>document.getElementById(id); const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
async function api(path,options={}){let r=await fetch(path,{...options,headers:{'X-API-Key':$('token').value,'Content-Type':'application/json'}});if(!r.ok)throw Error('HTTP '+r.status+': '+await r.text());return r.json()}
function addCheckpoint(){let el=document.createElement('div');el.className='card checkpoint';el.innerHTML='<label>Контрольная точка<input class="cp-title" placeholder="Помещение / участок"></label><div class="questions"></div><button class="secondary" onclick="addQuestion(this)">+ Вопрос</button><button class="danger" onclick="this.closest(\'.checkpoint\').remove()">Удалить точку</button>'; $('checkpoints').append(el);addQuestion(el.querySelector('button'))}
function addQuestion(button){let el=document.createElement('div');el.className='card question';el.innerHTML='<input class="q-title" placeholder="Текст вопроса"><div class="row"><select class="q-kind"><option value="status">Норма / Дефект / Не проверено</option><option value="text">Текст</option><option value="number">Число</option><option value="choice">Выбор из вариантов</option></select><input class="q-options" placeholder="Варианты через ; (для выбора)"></div><label><input class="q-required" type="checkbox" checked style="width:auto"> Обязательно</label> <button class="danger" onclick="this.closest(\'.question\').remove()">×</button>';button.closest('.checkpoint').querySelector('.questions').append(el)}
function value(el,s){return el.querySelector(s).value.trim()}
async function saveRoute(){try{let checkpoints=[...document.querySelectorAll('.checkpoint')].map(c=>({title:value(c,'.cp-title'),questions:[...c.querySelectorAll('.question')].map(q=>({title:value(q,'.q-title'),kind:value(q,'.q-kind'),required:q.querySelector('.q-required').checked,options:value(q,'.q-options').split(';').map(x=>x.trim()).filter(Boolean)}))}));await api('/api/routes',{method:'POST',body:JSON.stringify({name:$('routeName').value,description:$('description').value,checkpoints})});$('status').textContent='Маршрут сохранён';$('routeName').value='';$('description').value='';$('checkpoints').innerHTML='';addCheckpoint();await load()}catch(e){$('status').textContent=e.message}}
async function load(){try{let routes=await api('/api/routes');$('status').textContent='Соединение установлено';$('routes').innerHTML=routes.length?routes.map(r=>'<div class="card"><b>'+esc(r.name)+'</b><p>'+esc(r.description)+'</p>'+r.checkpoints.map(c=>'<div><b>'+esc(c.title)+'</b><small> ('+c.questions.length+' вопросов)</small></div>').join('')+'<button class="danger" onclick="deactivate(\''+r.id+'\')">Отключить маршрут</button></div>').join(''):'Маршрутов пока нет';await loadResults()}catch(e){$('status').textContent=e.message}}
async function deactivate(id){if(!confirm('Отключить маршрут для новых обходов? Старые результаты останутся.'))return;try{await api('/api/routes/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
async function loadResults(){try{let rows=await api('/api/inspections');$('results').innerHTML=rows.length?rows.map(r=>'<div class="card"><b>'+esc(r.route)+'</b> — '+esc(r.operator)+'<br><small>'+esc(r.performed_at)+'</small><p>'+esc(r.comment)+'</p><details><summary>Ответы ('+r.answers.length+')</summary><pre>'+esc(JSON.stringify(r.answers,null,2))+'</pre></details></div>').join(''):'Результатов пока нет'}catch(e){$('results').textContent=e.message}}
addCheckpoint();
</script></body></html>
