services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obhody
      POSTGRES_USER: obhody
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obhody"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://obhody:${POSTGRES_PASSWORD}@db:5432/obhody
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
volumes:
  pgdata:
